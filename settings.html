<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings — FAVS</title>
<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#202124">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script>
  // Apply saved theme before CSS to avoid a flash. Keep in sync with settings.js.
  try {
    var s = JSON.parse(localStorage.getItem('favs.settings.v1') || '{}');
    if (s.theme === 'light' || s.theme === 'dark') document.documentElement.setAttribute('data-theme', s.theme);
  } catch (e) {}
</script>
<link rel="stylesheet" href="styles.css?v=10">
<link rel="stylesheet" href="settings.css?v=5">
</head>
<body class="settings-body">
  <header class="settings-topbar">
    <a class="back" href="index.html">&larr; Start page</a>
    <h1>Settings</h1>
  </header>
  <div class="settings-layout">
    <nav class="settings-nav" aria-label="Settings sections">
      <button type="button" data-section="general" aria-selected="true">General</button>
      <button type="button" data-section="appearance" aria-selected="false">Appearance</button>
    </nav>
    <main class="settings-content">
      <section class="settings-section" data-section-panel="general">
        <h2>General</h2>
        <p class="desc">Basic preferences.</p>
        <div class="card">
          <div class="field">
            <label class="label" for="siteName">Site name</label>
            <input type="text" id="siteName" maxlength="60" placeholder="favs.eu.org">
          </div>
        </div>
        <div class="card">
          <div class="field">
            <label class="label">Reset</label>
            <div class="btn-row">
              <button class="btn danger" id="resetAll" type="button">Reset all settings</button>
            </div>
          </div>
        </div>
      </section>

      <section class="settings-section" data-section-panel="appearance" hidden>
        <h2>Appearance</h2>
        <p class="desc">Override the automatic light / dark mode.</p>
        <div class="card">
          <label class="radio-row"><input type="radio" name="theme" value="system"> System (follow browser)</label>
          <label class="radio-row"><input type="radio" name="theme" value="light"> Light</label>
          <label class="radio-row"><input type="radio" name="theme" value="dark"> Dark</label>
        </div>
      </section>

    </main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="settings.js?v=9"></script>
</body>
</html>
