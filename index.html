<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAVS</title>
<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#202124">
<script>
  // Apply saved theme before CSS to avoid a flash. Keep in sync with app.js.
  try {
    var s = JSON.parse(localStorage.getItem('favs.settings.v1') || '{}');
    if (s.theme === 'light' || s.theme === 'dark') document.documentElement.setAttribute('data-theme', s.theme);
  } catch (e) {}
</script>
<link rel="stylesheet" href="styles.css?v=1">
</head>
<body class="home">
  <div class="topbar">
    <a class="icon-btn" href="settings.html?v=1" title="Settings" aria-label="Settings">&#9881;</a>
  </div>
  <h1 class="site-title" id="siteTitle">favs.eu.org</h1>
  <form class="search-row" id="searchForm" action="https://www.google.com/search" method="GET">
    <input id="searchInput" type="text" name="q" placeholder="Search Google..." autofocus>
    <select class="engine-select" id="engineSelect" hidden aria-label="Search engine"></select>
    <button type="submit">Search</button>
  </form>
  <nav class="bookmarks" id="bookmarks" hidden aria-label="Bookmarks"></nav>
  <script src="app.js?v=1"></script>
</body>
</html>
