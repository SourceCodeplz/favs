<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAVS</title>
<meta name="color-scheme" content="light dark">
<meta name="description" content="FAVS — private start page with bookmarks and a local-only vault.">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#202124">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234285f4'/%3E%3Ctext x='16' y='22' font-family='system-ui,sans-serif' font-size='18' font-weight='700' fill='white' text-anchor='middle'%3EF%3C/text%3E%3C/svg%3E">
<script>
  // Apply saved theme before CSS to avoid a flash. Keep in sync with app.js.
  try {
    var s = JSON.parse(localStorage.getItem('favs.settings.v1') || '{}');
    if (s.theme === 'light' || s.theme === 'dark') document.documentElement.setAttribute('data-theme', s.theme);
  } catch (e) {}
</script>
<link rel="stylesheet" href="styles.css?v=6">
</head>
<body class="home">
  <div class="topbar">
    <a class="icon-btn" href="vault.html" title="Vault — saved clips" aria-label="Vault — saved clips"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="4.5" rx="1"/><path d="M5 8.5V19a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8.5"/><path d="M10 12h4"/></svg></a>
    <a class="icon-btn" href="settings.html" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.11-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 8.89a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.11A1.7 1.7 0 0 0 10.11 3V3a2 2 0 1 1 4 0v.09c0 .68.4 1.3 1 1.55.62.26 1.34.11 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.11c.26.62.88 1 1.55 1H21a2 2 0 1 1 0 4h-.09c-.68 0-1.3.4-1.51 1Z"/></svg></a>
  </div>
  <h1 class="site-title" id="siteTitle">favs.eu.org</h1>
  <form class="search-row" id="searchForm" action="https://www.google.com/search" method="GET" role="search">
    <span class="search-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></span>
    <input id="searchInput" type="text" name="q" placeholder="Search Google..." autofocus autocomplete="off" spellcheck="false" aria-label="Search">
    <select class="engine-select" id="engineSelect" hidden aria-label="Search engine"></select>
    <button type="submit">Search</button>
  </form>
  <nav class="bookmarks" id="bookmarks" aria-label="Bookmarks"></nav>
  <section class="clip-saver" aria-label="Quick save to vault">
    <textarea id="clipInput" rows="5" placeholder="Paste anything — links, text, notes… Ctrl+Enter saves it to your private vault." aria-label="Quick save to vault"></textarea>
    <div class="clip-saver-foot">
      <span class="clip-hint"><kbd>Ctrl</kbd> + <kbd>Enter</kbd> to save &middot; images &amp; files can be pasted too</span>
      <a class="clip-open" id="clipOpen" href="vault.html">Vault &rarr;</a>
      <button type="button" class="clip-save-btn" id="clipSave">Save</button>
    </div>
  </section>
  <p class="clip-status" id="clipStatus" role="status" aria-live="polite"></p>
  <section class="chat" aria-label="Local AI chat">
    <div class="chat-head">
      <div class="chat-title">
        <span class="chat-dot" id="chatDot" aria-hidden="true"></span>
        <strong>Local chat</strong>
        <span class="chat-model">LFM2.5-350M &middot; in-browser</span>
      </div>
      <div class="chat-head-actions">
        <button type="button" class="chat-clear-btn" id="chatClear" hidden>Clear</button>
        <button type="button" class="chat-load-btn" id="chatLoad">Download &amp; start</button>
      </div>
    </div>
    <p class="chat-sub" id="chatStatus" role="status" aria-live="polite">Runs 100% on your device. One-time ~200MB download, then cached.</p>
    <div class="chat-progress" id="chatProgress" hidden><span id="chatProgressBar"></span></div>
    <div class="chat-messages" id="chatMessages" aria-live="polite"></div>
    <form class="chat-row" id="chatForm" hidden>
      <input id="chatInput" type="text" placeholder="Ask anything…" autocomplete="off" spellcheck="false" aria-label="Chat with local model" disabled>
      <button type="submit" id="chatSend" disabled>Send</button>
    </form>
  </section>
  <div class="modal-backdrop" id="bookmarkModal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="bookmarkModalTitle">
      <h2 id="bookmarkModalTitle">Add bookmark</h2>
      <div class="modal-field">
        <label for="bookmarkTitle">Title</label>
        <input type="text" id="bookmarkTitle" maxlength="80" placeholder="My favorite site" autocomplete="off">
      </div>
      <div class="modal-field">
        <label for="bookmarkUrl">URL</label>
        <input type="url" id="bookmarkUrl" placeholder="https://example.com" inputmode="url" autocomplete="off">
      </div>
      <p class="modal-error" id="bookmarkError" hidden></p>
      <div class="modal-actions">
        <button type="button" class="btn danger" id="bookmarkDelete" hidden>Delete</button>
        <span class="modal-spacer"></span>
        <button type="button" class="btn secondary" id="bookmarkCancel">Cancel</button>
        <button type="button" class="btn" id="bookmarkSave">Add</button>
      </div>
    </div>
  </div>
  <script src="app.js?v=4"></script>
  <script type="module" src="chat.js?v=3"></script>
</body>
</html>
